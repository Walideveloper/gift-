<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Give Me A Gift - Puzzle for Zunaira Api 💖</title>
<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #1a1a1a, #000);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    color: white;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 28px;
    color: #ffcccc;
  }

  canvas {
    background: #222;
    border-radius: 10px;
    box-shadow: 0 0 25px rgba(255,0,0,0.5);
  }

  button {
    margin-top: 20px;
    padding: 12px 25px;
    background: crimson;
    border: none;
    color: white;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
  }

  button:hover {
    background: #ff4d4d;
  }
</style>
</head>
<body>
  <h1>🧩 Arrange the Letters to Spell "Give Me A Gift"</h1>
  <canvas id="puzzle" width="700" height="300"></canvas>
  <button onclick="resetPuzzle()">Reset Puzzle</button>

<script>
const canvas = document.getElementById('puzzle');
const ctx = canvas.getContext('2d');

let pieces = [];
let dragging = null;
let offsetX = 0, offsetY = 0;
let completed = false;

const targetText = "GIVE ME A GIFT";
const targetPositions = [];
const startX = 80;
const startY = 130;
const spacing = 45;

for (let i = 0; i < targetText.length; i++) {
  if (targetText[i] === " ") continue;
  targetPositions.push({
    char: targetText[i],
    x: startX + i * spacing,
    y: startY
  });
}

function createPieces() {
  pieces = targetPositions.map(t => ({
    ...t,
    x: Math.random() * 500 + 50,
    y: Math.random() * 150 + 100,
    placed: false
  }));
}

function drawTextPiece(x, y, text, color="red") {
  ctx.save();
  ctx.font = "bold 40px Poppins";
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Hint outline
  ctx.font = "bold 40px Poppins";
  ctx.fillStyle = "rgba(255,0,0,0.15)";
  let x = startX;
  for (let ch of targetText) {
    if (ch !== " ") ctx.fillText(ch, x, startY);
    x += spacing;
  }

  // Pieces
  for (let p of pieces) drawTextPiece(p.x, p.y, p.char);

  if (completed) {
    ctx.font = "bold 50px Poppins";
    ctx.fillStyle = "pink";
    ctx.fillText("💖 Zunaira Api 💖", 180, 150);
  }
}

canvas.onmousedown = e => {
  const mx = e.offsetX, my = e.offsetY;
  for (let p of pieces) {
    if (mx > p.x && mx < p.x + 30 && my > p.y - 40 && my < p.y) {
      dragging = p;
      offsetX = mx - p.x;
      offsetY = my - p.y;
      break;
    }
  }
};

canvas.onmousemove = e => {
  if (dragging) {
    dragging.x = e.offsetX - offsetX;
    dragging.y = e.offsetY - offsetY;
  }
};

canvas.onmouseup = () => {
  if (dragging) {
    const t = targetPositions.find(tp => tp.char === dragging.char && !tp.used);
    if (t && Math.abs(dragging.x - t.x) < 20 && Math.abs(dragging.y - t.y) < 20) {
      dragging.x = t.x;
      dragging.y = t.y;
      dragging.placed = true;
      t.used = true;
    }
    dragging = null;
    checkCompletion();
  }
};

function checkCompletion() {
  if (pieces.every(p => p.placed)) {
    completed = true;
    setTimeout(blastEffect, 800);
  }
}

function blastEffect() {
  let frames = 0;
  const blast = setInterval(() => {
    for (let p of pieces) {
      p.x += (Math.random() - 0.5) * 50;
      p.y += (Math.random() - 0.5) * 50;
    }
    draw();
    if (++frames > 15) clearInterval(blast);
  }, 80);
}

function resetPuzzle() {
  completed = false;
  targetPositions.forEach(tp => delete tp.used);
  createPieces();
  draw();
}

createPieces();
setInterval(draw, 60);
</script>
</body>
</html>
